# Local development and self-hosting.
#
# docs/ARCHITECTURE.md commits to `docker compose up` bringing up a complete
# self-hosted instance. Today that is only Postgres, because services/api is
# the only thing that needs it and is still run from the host with `pnpm dev`.
# The api and web services join this file as they gain Dockerfiles, which is
# why the database is already on a named network and a named volume rather
# than the defaults.

name: cos

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cos}
    ports:
      # Host port is configurable so a developer with a system Postgres on
      # 5432 does not have to shut it down to work on this.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cos
    healthcheck:
      # Migrations run immediately after boot, so anything depending on this
      # needs to wait for real readiness rather than for the container to exist.
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-cos} -d ${POSTGRES_DB:-cos}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Object storage for uploaded documents.
  #
  # MinIO is S3-compatible, so this is the *same code path* the API uses
  # against R2 or AWS in production - only the endpoint and credentials differ.
  # That
  # is the point of running it here rather than writing a filesystem driver for
  # development: a driver only used locally is a driver whose bugs are only
  # found in production.
  #
  # Authored text documents do not touch this. Their content lives in Postgres,
  # so a self-hoster who never uploads a file never needs this container.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-cos_dev_access_key}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-cos_dev_secret_key}
    ports:
      # 9000 is the S3 API, 9001 the web console.
      - '${STORAGE_PORT:-9000}:9000'
      - '${STORAGE_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    networks:
      - cos
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  minio-data:

networks:
  cos:
